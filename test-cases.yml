    - В открывшемся меню выбрать "Настройки" ("Settings")
    - В открывшемся окне выбрать "Ваше оружие" ("Your weapon")
    - Выбрать язык JavaScript (Node.JS)
  expected-result: |
    Язык JavaScript (Node.JS) успешно выбран и сохранён как предпочитаемый

