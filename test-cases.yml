---
- summary: |
    Проверка успешной регистрации нового пользователя через GitHub
  requirement: |
    Пользователь должен иметь возможность зарегистрироваться на сервисе через аккаунт GitHub
  prerequisites: |
    Открыта страница регистрации на Codebattle, пользователь не авторизован, есть действующий GitHub-аккаунт
  test-data: |
    GitHub-аккаунт = oxicburdina@gmail.com
  steps:
    - Нажать кнопку "Зарегестрироваться через GitHub" ("Sign up with GitHub")
    - В открывшемся окне авторизации GitHub ввести логин и пароль от GitHub-аккаунта
  expected-result: |
    Пользователь успешно авторизован и перенаправлен на главную страницу Codebattle, в интерфейсе отображается имя пользователя
    из GitHub

- summary: |
    Проверка входа существующего пользователя через GitHub
  requirement: |
    Зарегистрированный пользователь должен иметь возможность войти в систему через GitHub
  prerequisites: |
    Пользователь ранее уже регистрировался через GitHub, открыта страница входа Codebattle
  test-data: |
    GitHub-аккаунт = oxicburdina@gmail.com (аккаунт, который уже использовался для регистрации)
  steps:
    - Нажать кнопку "Войти через GitHub" ("Sign in with GitHub")
    - В открывшемся окне авторизации GitHub ввести логин и пароль от GitHub-аккаунта
  expected-result: |
    Пользователь успешно входит в систему без повторного запроса разрешений, перенаправляется на главную страницу

- summary: |
    Проверка входа с несуществующим GitHub-аккаунтом
  requirement: |
    Система должна корректно обрабатывать ситуацию, когда пользователь вводит неверные данные для входа в GitHub
  prerequisites: |
    Открыта страница входа Codebattle
  test-data: |
    Логин GitHub = несуществующий_пользователь, Пароль = любой_пароль
  steps:
    - Нажать кнопку "Войти через GitHub" ("Sign in with GitHub")
    - В окне авторизации GitHub ввести несуществующий логин и любой пароль
    - Нажать кнопку входа
  expected-result: |
    GitHub показывает сообщение об ошибке "Неверный логин или пароль", пользователь не перенаправляется обратно в Codebattle

- summary: |
    Проверка отображения профиля пользователя после авторизации
  requirement: |
    После успешной авторизации в интерфейсе должна отображаться информация о пользователе (имя, аватар)
  prerequisites: |
    Пользователь успешно авторизован через GitHub
  test-data: |
    GitHub-аккаунт = oxicburdina@gmail.com
  steps:
    - После успешного входа обратить внимание на верхнюю панель навигации
  expected-result: |
    В правом верхнем углу отображается имя пользователя (или никнейм из GitHub) и его аватар

- summary: |
    Проверка выхода из системы
  requirement: |
    Авторизованный пользователь должен иметь возможность выйти из системы
  prerequisites: |
    Пользователь авторизован на сайте
  test-data: |
    Без тестовых данных
  steps:
    - Нажать на аватар или имя пользователя в правом верхнем углу
    - В выпадающем меню выбрать "Выйти" ("Sign Out") 
  expected-result: |
    Пользователь выходит из системы, перенаправляется на главную страницу в неавторизованном состоянии, снова появляются кнопки "Sign in" ("Sign up")

- summary: |
    Проверка создания простой игры неавторизованным пользователем
  requirement: |
    Неавторизованные пользователи должны иметь возможность создавать игру
  prerequisites: |
    Пользователь не авторизован
  test-data: |
    Без тестовых данных
  steps:
    - Нажать кнопку "Попробуйте простой бой" ("Try simple battle)
  expected-result: |
    Игра начинается неавторизированным ползователем

- summary: |
    Проверка отображения истории игр авторизованного пользователя
  requirement: |
    Авторизованный пользователь должен иметь доступ к истории своих завершенных игр
  prerequisites: |
    Пользователь авторизован и сыграл хотя бы одну игру
  test-data: |
    Без тестовых данных
  steps:
    - Нажать на аватар или имя пользователя
    - Выбрать пункт "Турниры" ("Tournaments") 
    - Нажать на вкладку "Мои турниры" ("My Tournaments")
  expected-result: |
    Отображается список завершенных игр пользователя

- summary: |
    Проверка создания игры против случайного соперника
  requirement: |
    Пользователь должен иметь возможность создать игру против случайного соперника
  prerequisites: |
    Пользователь авторизован на сайте через GitHub
  test-data: |
    - "Уровень" ("Level") = 1 
    - "Тип игры" ("Game Type") = С другим пользователем (With other user)
    - "Контроль времени" ("Time control") = 10
    - "Выберите задачу по названию или тегам" ("Choose task by name or tags") = Случайное задание (Random task)
  steps:
    - Нажать кнопку  "Создать битву" ("Create a battle")
    - В модальном окне выбрать уровень "Уровень" ("Level")  
    - В модальном окне выбрать тип игры "Тип игры" ("Game Type") 
    - В модальном окне установить время "Контроль времени" ("Time control") 
    - В модальном окне выбрать задачу по названию или тегам "Выберите задачу по названию или тегам" ("Choose task by name or tags") 
    - Нажать кнопку "Создать" ("Create a battle")
  expected-result: |
    Открывается окно игры с ожиданием соперника, через некоторое время находится случайный соперник и игра начинается

- summary: |
    Проверка создания игры против бота
  requirement: |
    Пользователь должен иметь возможность создать игру против бота
  prerequisites: |
    Пользователь авторизован на сайте через GitHub
  test-data: |
    - "Уровень" ("Level") = 1 
    - "Тип игры" ("Game Type") = С помощью бота (With a bot)
    - "Контроль времени" ("Time control") = 10
    - "Выберите задачу по названию или тегам" ("Choose task by name or tags") = Случайное задание (Random task)
  steps:
    - Нажать кнопку  "Создать битву" ("Create a battle")
    - В модальном окне выбрать уровень "Уровень" ("Level")  
    - В модальном окне выбрать тип игры "Тип игры" ("Game Type") 
    - В модальном окне установить время "Контроль времени" ("Time control") 
    - В модальном окне выбрать задачу по названию или тегам "Выберите задачу по названию или тегам" ("Choose task by name or tags") 
    - Нажать кнопку "Создать" ("Create a battle")
  expected-result: |
    Игра начинается сразу с ботом, без ожидания другого игрока

- summary: |
    Проверка создания игры против друга по ссылке-приглашению
  requirement: |
    Пользователь должен иметь возможность создать игру против друга (по ссылке-приглашению)
  prerequisites: |
    Пользователь авторизован на сайте через GitHub
  test-data: |
    - "Уровень" ("Level") = 1 
    - "Тип игры" ("Game Type") = С помощью бота (With a bot)
    - "Контроль времени" ("Time control") = 10
    - "Выберите задачу по названию или тегам" ("Choose task by name or tags") = Случайное задание (Random task)
  steps:
    - Нажать кнопку  "Создать битву" ("Create a battle")
    - В модальном окне выбрать уровень "Уровень" ("Level")  
    - В модальном окне выбрать тип игры "Тип игры" ("Game Type") 
    - В модальном окне установить время "Контроль времени" ("Time control") 
    - В модальном окне выбрать задачу по названию или тегам "Выберите задачу по названию или тегам" ("Choose task by name or tags") 
    - Нажать кнопку "Создать" ("Create a battle")
  expected-result: |
    Открывается окно игры с ожиданием друга, после перехода друга по ссылке начинается игра

- summary: |
    Проверка выбора языка программирования перед игрой
  requirement: |
    Пользователь должен иметь возможность выбрать язык программирования для решения задачи из списка поддерживаемых
  prerequisites: |
    Пользователь авторизован, открыто модальное окно создания игры
  test-data: |
    Язык = JavaScript (Node.JS)
  steps:
    - В модальном окне создания игры найти выпадающий список выбора языка
    - Выбрать язык JavaScript (Node.JS)
  expected-result: |
    В открывшемся редакторе код должен быть предзаполнен шаблоном для выбранного языка

- summary: |
    Проверка отображения рейтинга игроков
  requirement: |
    В проекте должна быть реализована рейтинговая система, отображающая топ игроков
  prerequisites: |
    Пользователь находится на главной странице
  test-data: |
    Без тестовых данных
  steps:
    - Нажать на аватар или имя пользователя
    - Выбрать пункт "Зал славы" ("Hall of Fame") 
  expected-result: |
    Отображается таблица с топом игроков с их очками и статистикой

- summary: |
    Проверка доступности условий задачи на двух языках
  requirement: |
    Условия задач должны быть доступны на двух языках: русском и английском
  prerequisites: |
    Пользователь авторизован, открыто модальное окно создания игры
  test-data: |
    Без тестовых данных
  steps:
    - В модальном окне создания игры найти выпадающий список выбора языка
    - Выбрать язык Ru
    - Посмотреть условие текущей задачи
  expected-result: |
    Условие задачи отображается на русском языке
