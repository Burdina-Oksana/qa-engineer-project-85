---
- summary: |
    Проверка успешной регистрации нового пользователя через GitHub
  requirement: |
    Пользователь должен иметь возможность зарегистрироваться на сервисе через аккаунт GitHub
  prerequisites: |
    Открыта главная страница Codebattle, пользователь не авторизован, есть действующий GitHub-аккаунт
  test-data: |
    GitHub-аккаунт = oxicburdina@gmail.com
  steps:
    - Нажать кнопку "Зарегестрироваться" ("Sign up")
    - В открывшемся окне регистрации нажать кнопку "Зарегестрироваться через GitHub" ("Sign up with GitHub")
    - В открывшемся окне авторизации GitHub ввести логин и пароль от GitHub-аккаунта
  expected-result: |
    Пользователь успешно авторизован и перенаправлен на главную страницу Codebattle, в интерфейсе отображается имя пользователя
    из GitHub
