- summary: |
    Проверка создания игры против друга по ссылке-приглашению
  requirement: |
    Пользователь должен иметь возможность создать игру против друга (по ссылке-приглашению)
  prerequisites: |
    Пользователь авторизован на сайте через GitHub
  test-data: |
