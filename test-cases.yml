---
- summary: |
    Проверка успешной регистрации нового пользователя через GitHub
  requirement: |
    Пользователь должен иметь возможность зарегистрироваться на сервисе через аккаунт GitHub
  prerequisites: |
    Открыта главная страница Codebattle, пользователь не авторизован, есть действующий GitHub-аккаунт
  test-data: |
    GitHub-аккаунт = oxicburdina@gmail.com
  steps:
    - Нажать кнопку "Зарегестрироваться" ("Sign up")
    - В открывшемся окне регистрации нажать кнопку "Зарегестрироваться через GitHub" ("Sign up with GitHub")
    - В открывшемся окне авторизации GitHub ввести логин и пароль от GitHub-аккаунта
  expected-result: |
    Пользователь успешно авторизован и перенаправлен на главную страницу Codebattle, в интерфейсе отображается имя пользователя
    из GitHub

- summary: |
    Проверка входа существующего пользователя через GitHub
  requirement: |
    Зарегистрированный пользователь должен иметь возможность войти в систему через GitHub-аккаунт
  prerequisites: |
    Открыта главная страница Codebattle, пользователь не авторизован, есть действующий GitHub-аккаунт
  test-data: |
    GitHub-аккаунт = oxicburdina@gmail.com (аккаунт, который уже использовался для регистрации)
  steps:
    - Нажать кнопку "Войти" ("Sign in")
    - В открывшемся окне входа нажать кнопку "Войти через GitHub" ("Sign in with GitHub")
    - В открывшемся окне авторизации GitHub ввести логин и пароль от GitHub-аккаунта
  expected-result: |
    Пользователь успешно входит в систему без повторного запроса разрешений, перенаправляется на главную страницу

- summary: |
    Невозможность входа с несуществующим GitHub-аккаунтом
  requirement: |
    Система должна корректно обрабатывать ситуацию, когда пользователь вводит неверные данные для входа в GitHub
  prerequisites: |
    Открыта главная страница Codebattle, пользователь не авторизован
  test-data: |
    Логин GitHub = несуществующий_пользователь, Пароль = любой_пароль
  steps:
    - Нажать кнопку "Войти" ("Sign in")
    - В открывшемся окне входа нажать кнопку "Войти через GitHub" ("Sign in with GitHub")
    - В окне авторизации GitHub ввести несуществующий логин и любой пароль
    - Нажать кнопку входа
  expected-result: |
    GitHub показывает сообщение об ошибке "Неверный логин или пароль", пользователь не перенаправляется обратно в Codebattle

- summary: |
    Проверка отображения профиля пользователя после авторизации
  requirement: |
    После успешной авторизации в интерфейсе должна отображаться информация о пользователе (имя, аватар)
  prerequisites: |
    Пользователь успешно авторизован через GitHub
  test-data: |
    GitHub-аккаунт = oxicburdina@gmail.com
  steps:
    - После успешного входа обратить внимание на верхнюю панель навигации
  expected-result: |
    В правом верхнем углу отображается имя пользователя (или никнейм из GitHub) и его аватар

- summary: |
    Проверка выхода из системы
  requirement: |
    Авторизованный пользователь должен иметь возможность выйти из системы
  prerequisites: |
    Пользователь авторизован на сайте
  test-data: |
    Без тестовых данных
  steps:
    - Нажать на аватар или имя пользователя в правом верхнем углу
    - В выпадающем меню выбрать "Выйти" ("Sign Out") 
  expected-result: |
    Пользователь выходит из системы, перенаправляется на главную страницу в неавторизованном состоянии, снова появляются кнопки "Sign in" ("Sign up")

- summary: |
    Проверка создания простой игры неавторизованным пользователем
  requirement: |
    Неавторизованные пользователи должны иметь возможность создавать игру
  prerequisites: |
    Пользователь не авторизован
  test-data: |
    Без тестовых данных
  steps:
    - Нажать кнопку "Попробуйте простой бой" ("Try simple battle)
  expected-result: |
    Игра начинается неавторизированным ползователем

- summary: |
    Проверка отображения истории игр авторизованного пользователя
  requirement: |
    Авторизованный пользователь должен иметь доступ к истории своих завершенных игр
  prerequisites: |
    Пользователь авторизован и сыграл хотя бы одну игру
  test-data: |
    Без тестовых данных
  steps:
    - Нажать на аватар или имя пользователя
    - Выбрать пункт "Турниры" ("Tournaments") 
    - Нажать на вкладку "Мои турниры" ("My Tournaments")
  expected-result: |
    Отображается список завершенных игр пользователя

- summary: |
    Проверка создания игры против случайного соперника
  requirement: |
    Пользователь должен иметь возможность создать игру против случайного соперника
  prerequisites: |
    Пользователь авторизован на сайте через GitHub
  test-data: |
    - "Уровень" ("Level") = 1 
    - "Тип игры" ("Game Type") = С другим пользователем (With other user)
    - "Контроль времени" ("Time control") = 10
    - "Выберите задачу по названию или тегам" ("Choose task by name or tags") = Случайное задание (Random task)
  steps:
    - Нажать кнопку  "Создать битву" ("Create a battle")
    - В модальном окне выбрать уровень "Уровень" ("Level")  
    - В модальном окне выбрать тип игры "Тип игры" ("Game Type") 
    - В модальном окне установить время "Контроль времени" ("Time control") 
    - В модальном окне выбрать задачу по названию или тегам "Выберите задачу по названию или тегам" ("Choose task by name or tags") 
    - Нажать кнопку "Создать" ("Create a battle")
  expected-result: |
    Открывается страница с заголовком "Ожидание соперника" ("Waiting for opponent")
    На странице присутствуют элементы интерфейса ожидания:
    - Текст "Please wait for someone to join or send an invite using the link below"
    - Уникальная ссылка вида https://codebattle.hexlet.io/games/{число}/
    - Кнопка "Copy" для копирования ссылки
    - Кнопка "Cancel" для отмены ожидания
    При нажатии "Cancel" происходит возврат на главную страницу
    При обновлении страницы состояние ожидания сохраняется
    Если находится случайный соперник, игра начинается

    - summary: |
    Проверка присоединения второго игрока к созданной игре 
  requirement: |
    При создании игры против случайного соперника другой пользователь должен иметь возможность присоединиться 
  prerequisites: |
    - Игрок А и игрок Б авторизованы на сайте 
    - Игрок А создал игру согласно тест-кейсу "Проверка создания игры против случайного соперника"
    - Игрок А находится на странице ожидания с уникальной ссылкой
    - Игрок Б находится на главной странице Codebattle
  test-data: |
    - "Уровень" ("Level") = 1 
    - "Тип игры" ("Game Type") = С другим пользователем (With other user)
    - "Контроль времени" ("Time control") = 10
    - "Выберите задачу по названию или тегам" ("Choose task by name or tags") = Случайное задание (Random task)
  steps:
    - Игрок Б: Нажать кнопку "Присоединиться к битве" ("Join a battle")
    - Игрок Б: Выбирает битву, созданную игроком А
  expected-result: |
    Игрок А:
    - Исчезает окно ожидания соперника, открывается окно с редактором кода
    Игрок Б:
    - Открывается окно с редактором кода
    
    **Во время игры (для обоих игроков):**
    - Отображается редактор кода с возможностью редактирования
    - Отображается описание задачи с входными данными и ожидаемым результатом
    - Отображается таймер обратного отсчёта (синхронно для обоих)
    - Отображается имя соперника и его рейтинг
    - Доступен чат для общения с соперником
    - Кнопка "Запустить" запускает тесты и показывает результат (success/failure) с указанием времени выполнения
    - Доступен выбор режима редактора 

    **При успешном решении задачи одним из игроков:**
    - Появляется уведомление о победе: "Баттл официально затащен! Чемпион"
    - Игра завершается, активный игровой экран блокируется
    - Отображается финальный результат с указанием победителя
    - Показывается итоговое время завершения игры 
    - Отображается сообщение "Opponent has left" для проигравшего или зрителя
    - Становится доступна кнопка "На главную" ("Back to main page")

    **Если игрок решает задачу, но тесты не проходят:**
    - Отображается сообщение об ошибке с указанием причины
    - Игра продолжается до истечения таймера или успешного решения соперником

    **Если таймер истёк:**
    - Игра завершается
    - Победителем объявляется игрок с наибольшим количеством пройденных тестов (или ничья)
     
