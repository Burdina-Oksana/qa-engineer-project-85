---
- summary: |
    Проверка создания игры против случайного соперника
  requirement: |
    Пользователь должен иметь возможность создать игру против случайного соперника
  prerequisites: |
    Пользователь авторизован на сайте через GitHub
  test-data: |
    Без тестовых данных
  steps:
    - Нажать кнопку "Create a battle" или "Создать битву"
    - В модальном окне выбрать уровень "Level" или "Уровень"
    - В модальном окне выбрать тип игры "Game Type" или "Тип игры"
    - В модальном окне установить время "Time control" или "Контроль времени"
    - В модальном окне выбрать задачу по названию или тегам "Choose task by name or tags" или "Выберите задачу по названию или тегам"
    - Нажать кнопку "Create a battle" или "Создать"
  expected-result: |
    Открывается окно игры с ожиданием соперника, через некоторое время находится случайный соперник и игра начинается

- summary: |
    Проверка создания игры против бота
  requirement: |
    Пользователь должен иметь возможность создать игру против бота
  prerequisites: |
    Пользователь авторизован на сайте через GitHub
  test-data: |
    Без тестовых данных
  steps:
    - Нажать кнопку "New game" или "Создать игру"
    - В модальном окне выбрать опцию "Bot" или "Бот"
    - Нажать кнопку "Create" или "Создать"
  expected-result: |
    Игра начинается сразу с ботом, без ожидания другого игрока

- summary: |
    Проверка создания игры против друга по ссылке-приглашению
  requirement: |
    Пользователь должен иметь возможность создать игру против друга (по ссылке-приглашению)
  prerequisites: |
    Пользователь авторизован на сайте через GitHub
  test-data: |
    Без тестовых данных
  steps:
    - Нажать кнопку "New game" или "Создать игру"
    - В модальном окне выбрать опцию "Friend" или "Друг"
    - Нажать кнопку "Create" или "Создать"
    - Скопировать сгенерированную ссылку-приглашение
    - Отправить ссылку другу
  expected-result: |
    Открывается окно игры с ожиданием друга, после перехода друга по ссылке начинается игра

- summary: |
    Проверка выбора языка программирования перед игрой
  requirement: |
    Пользователь должен иметь возможность выбрать язык программирования для решения задачи из списка поддерживаемых
  prerequisites: |
    Пользователь авторизован, открыто модальное окно создания игры
  test-data: |
    Язык = JavaScript (NodeJS)
  steps:
    - В модальном окне создания игры найти выпадающий список выбора языка
    - Выбрать язык JavaScript (NodeJS)
    - Нажать кнопку создания игры
  expected-result: |
    В открывшемся редакторе код должен быть предзаполнен шаблоном для выбранного языка

- summary: |
    Проверка смены языка программирования во время игры
  requirement: |
    Система должна позволять пользователю менять язык программирования в процессе решения задачи
  prerequisites: |
    Пользователь находится в активной игре
  test-data: |
    Новый язык = Python
  steps:
    - В процессе игры найти выпадающий список выбора языка в интерфейсе
    - Выбрать другой язык (например, Python)
  expected-result: |
    Редактор кода очищается или заменяется шаблоном для нового языка, код можно писать на выбранном языке

- summary: |
    Проверка отправки сообщения в чат во время игры
  requirement: |
    Игроки должны иметь возможность общаться друг с другом через встроенный чат во время игры
  prerequisites: |
    Пользователь находится в активной игре с другим игроком или ботом
  test-data: |
    Текст сообщения = "Привет! Удачи в игре!"
  steps:
    - Найти поле ввода чата в интерфейсе игры
    - Ввести текст сообщения
    - Нажать Enter или кнопку отправки
  expected-result: |
    Сообщение появляется в окне чата у обоих игроков

- summary: |
    Проверка создания игры с выбором конкретной задачи
  requirement: |
    Пользователь должен иметь возможность создавать игру, выбирая конкретную задачу из списка
  prerequisites: |
    Пользователь авторизован
  test-data: |
    Задача = "Rectangle area" или "Площадь прямоугольника"
  steps:
    - Нажать кнопку "New game" или "Создать игру"
    - В модальном окне выбрать опцию "Choose game" или "Выбрать игру"
    - В списке задач найти и выбрать "Rectangle area" (Площадь прямоугольника)
    - Нажать кнопку создания игры
  expected-result: |
    Открывается игра с выбранной задачей, условие задачи отображается в интерфейсе

- summary: |
    Проверка выбора уровня сложности при создании игры
  requirement: |
    Система должна поддерживать выбор уровня сложности задачи при создании игры
  prerequisites: |
    Пользователь авторизован
  test-data: |
    Сложность = Easy (Легкая)
  steps:
    - Нажать кнопку "New game" или "Создать игру"
    - В модальном окне выбрать уровень сложности "Easy"
    - Нажать кнопку создания игры
  expected-result: |
    Подбирается или создается игра с задачей легкого уровня сложности

- summary: |
    Проверка доступности повтора игры после завершения
  requirement: |
    По окончании игры должен быть доступен ее повтор (replay) с возможностью просмотра процесса написания кода обоими участниками
  prerequisites: |
    Завершена как минимум одна игра
  test-data: |
    Без тестовых данных
  steps:
    - Перейти в профиль или историю игр
    - Найти завершенную игру
    - Нажать кнопку "Replay" или "Повтор"
  expected-result: |
    Открывается replay-режим, где можно увидеть процесс написания кода обоими игроками в хронологическом порядке

- summary: |
    Проверка отображения рейтинга игроков
  requirement: |
    В проекте должна быть реализована рейтинговая система, отображающая топ игроков за неделю, месяц и за все время
  prerequisites: |
    Пользователь находится на главной странице
  test-data: |
    Без тестовых данных
  steps:
    - Найти на главной странице или в навигации раздел "Rating" или "Рейтинг"
    - Переключить периоды: "Week" (Неделя), "Month" (Месяц), "All time" (За все время)
  expected-result: |
    Отображается таблица с топом игроков для выбранного периода, с их очками и статистикой

- summary: |
    Проверка наблюдения за игрой других участников (режим зрителя)
  requirement: |
    Пользователи (зрители) должны иметь возможность наблюдать за ходом игры других участников в реальном времени
  prerequisites: |
    Есть активные игры других пользователей
  test-data: |
    Без тестовых данных
  steps:
    - Найти на главной странице список текущих игр
    - Выбрать любую активную игру
    - Нажать "Watch" или "Смотреть"
  expected-result: |
    Открывается окно просмотра, где виден процесс игры обоих участников в реальном времени

- summary: |
    Проверка доступности условий задачи на двух языках
  requirement: |
    Условия задач должны быть доступны на двух языках: русском и английском
  prerequisites: |
    Пользователь находится в активной игре
  test-data: |
    Язык интерфейса = Русский
  steps:
    - Переключить язык интерфейса на Русский
    - Посмотреть условие текущей задачи
  expected-result: |
    Условие задачи отображается на русском языке

- summary: |
    Проверка игры без регистрации
  requirement: |
    Незарегистрированные пользователи должны иметь возможность играть, но для сохранения статистики и участия в рейтинге необходима регистрация
  prerequisites: |
    Пользователь не авторизован (вышел из аккаунта)
  test-data: |
    Без тестовых данных
  steps:
    - Нажать кнопку "New game" или "Создать игру"
    - Выбрать опцию игры против бота
    - Начать игру
  expected-result: |
    Игра начинается, но в интерфейсе отображается предупреждение, что результаты не будут сохранены в рейтинге

- summary: |
    Проверка начисления баллов при частичном решении задачи
  requirement: |
    При частичном решении задачи (прохождении не всех тестов) игрок должен получать утешительные баллы пропорционально количеству пройденных тестов
  prerequisites: |
    Пользователь находится в активной игре
  test-data: |
    Код решения = решение, проходящее только половину тестов
  steps:
    - Написать решение, которое проходит не все тесты (например, только 2 из 4)
    - Нажать кнопку отправки решения
    - Дождаться окончания игры
    - Проверить полученные очки
  expected-result: |
    Игрок получает баллы пропорционально количеству пройденных тестов, игра завершается
