functional:
  - Пользователь должен иметь возможность создать игру против случайного соперника, друга (по ссылке-приглашению) или бота
  - Во время игры участники должны видеть редактор кода, процесс набора кода и статус прохождения тестов своего соперника в реальном времени
  - Пользователь должен иметь возможность выбрать язык программирования для решения задачи из списка поддерживаемых 
  - Система должна позволять пользователю менять язык программирования в процессе решения задачи
  - Игроки должны иметь возможность общаться друг с другом через встроенный чат во время игры
  - Пользователь должен иметь возможность создавать игру, выбирая конкретную задачу из списка или полагаясь на случайный выбор
  - Система должна поддерживать выбор уровня сложности задачи при создании игры
  - По окончании игры должен быть доступен ее повтор (replay) с возможностью просмотра процесса написания кода обоими участниками
  - В проекте должна быть реализована рейтинговая система, отображающая топ игроков за неделю, месяц и за все время
  - Пользователи должны иметь возможность наблюдать за ходом игры других участников в реальном времени
  - Условия задач должны быть доступны на двух языках русском и английском
  - Незарегистрированные пользователи должны иметь возможность играть, но для сохранения статистики и участия в рейтинге необходима регистрация 
  
non-functional:
  - Сайт должен быть оптимизирован для скорости работы
  - Сайт должен быть безопасным и защищать данные пользователя 
  - Сайт должен быть удобным на мобильном устройстве (адаптивный дизайн)
  - Сайт должен быть протестирован на совместимость с последними версиями основных браузеров (Chrome, Firefox, Safari, Edge)
  - Сайт должен быть способен обрабатывать большое количество одновременных пользователей (например, до 1000+ одновременных игроков) 
  - Система должна быть отказоустойчивой — при сбое одного из компонентов игра не должна прерываться для всех пользователей
  
implicit:
  - Процесс решения задачи должен способствовать обучению: просмотр кода соперника должен помогать пользователям узнавать новые подходы и языки
  - Проект должен поддерживать культуру open source: приветствовать вклад новых разработчиков, иметь понятные правила участия и активное сообщество
  - В игре должен соблюдаться принцип fair play — система подбора соперников должна учитывать уровень игроков (рейтинг)
  - Пользователь не должен сталкиваться с техническими ограничениями
  - Сообщество разработчиков и игроков должно иметь возможность влиять на развитие проекта (предлагать новые функции, сообщать об ошибках)
